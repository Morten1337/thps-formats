[project]
name = "thps_formats"
version = "0.3.0"
description = "A Python library for working with file formats used in the Tony Hawk's Pro Skater game series"
authors = [{name = "MK"}]
license = {text = "MIT"}
requires-python = ">=3.14"
dependencies = [
    "colorama",
    "xmltodict",
    "pillow",
    "pypng",
    "semver",
    "pylzss",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "pywin32; sys_platform == 'win32'",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pyinstaller>=6.0",
    "pytest>=8.4.2",
]
